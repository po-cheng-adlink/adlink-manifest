    path: sources/meta-nxp-demo-experience
    refspec: 52eaf8bf42f8eda2917a1c8c046003c8c2c8f629

bblayers_conf_header:
  standard: |
    LCONF_VERSION = "7"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""

local_conf_header:
  reduce_diskspace: |
    INHERIT += "rm_work"
  standard: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_deb"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES += "debug-tweaks package-management"
  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
  build-info: |
    INHERIT += "image-buildinfo"
    IMAGE_BUILDINFO_VARS = "DISTRO DISTRO_VERSION MACHINE DEVICE_MODEL DEVICE_TYPE IMX_GPU_VERSION RELEASE_VERSION"
    RELEASE_VERSION = "v2.01.03"
  license-flags: |
    ACCEPT_FSL_EULA = "1"
  users-groups: |
    EXTRA_USERS_PARAMS += " useradd -m -s /bin/bash -a -G video,render,wayland,input,root,sudo,dialout,plugdev,tty,disk -p '$(openssl passwd adlink)' adlink; \
                            usermod -a -G video,render,wayland,input,root,sudo,dialout,plugdev,tty,disk -p '$(openssl passwd weston)' weston; \
                            usermod -p '$(openssl passwd root)' root;"
  language-pack: |
    GLIBC_GENERATE_LOCALES = " en_US.UTF-8 en_GB.UTF-8 zh_TW.UTF-8 zh_CN.UTF-8 \
                               fr_FR.UTF-8 es_ES.UTF-8 de_DE.UTF-8 pt_BR.UTF-8 \
                               ja_JP.UTF-8 ko_KR.UTF-8 th_TH.UTF-8 vi_VN.UTF-8 \
                               ms_MY.UTF-8 id_ID.UTF-8"
    IMAGE_LINGUAS = " en-us en-gb zh-tw zh-cn fr-fr es-es de-de pt-br \
                      ja-jp ko-kr th-th vi-vn ms-my id-id"
    IMAGE_INSTALL:append = " glibc-utils localedef locale-base-en-us locale-base-en-gb \
                             locale-base-zh-tw locale-base-zh-cn locale-base-fr-fr \
                             locale-base-es-es locale-base-de-de locale-base-pt-br \
                             locale-base-ja-jp locale-base-ko-kr locale-base-th-th \
                             locale-base-vi-vn locale-base-ms-my locale-base-id-id"
    IMAGE_INSTALL:append = " source-han-sans-tw-fonts source-han-sans-kr-fonts \
                             source-han-sans-jp-fonts source-han-sans-cn-fonts \
                             ttf-tlwg"
    CUSTOM_DEFAULT_LOCALE_LANG = "en_US.UTF-8"
  image-features: |
    IMAGE_FEATURES[validitems] += "kiosk-mode hab remote logo resize locale fastboot"
    EXTRA_IMAGE_FEATURES += "ssh-server-openssh"
    DISTRO_FEATURES:append = " sensors adlink optee"
    MACHINE_FEATURES:append = " stmm"
    IMAGE_FSTYPES = "wic.bmap wic.gz"
  sanity-check: |
    CONNECTIVITY_CHECK_URIS = "https://www.google.com"
  extra-packages: |
    IMAGE_INSTALL:append = " chromium-ozone-wayland"
  package-configs: |
    TOOLCHAIN_TARGET_TASK:append = " onnxruntime-dev"
    PACKAGECONFIG:append:pn-qemu-system-native = " sdl"
    PACKAGECONFIG:append:pn-opencv_mx8 = " test"
    UBOOT_EXTRA_CONFIGS:append = " LPDDR4_ALL"

