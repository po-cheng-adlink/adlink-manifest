    path: sources/meta-nxp-desktop
    refspec: 5f5bfd21c445eaa2d963d4b606d9ef56078eab8f

bblayers_conf_header:
  standard: |
    LCONF_VERSION = "7"
    BSPDIR := "${@os.path.abspath(os.path.dirname(d.getVar('FILE', True)) + '/../..')}"

local_conf_header:
  reduce_diskspace: |
    INHERIT += "rm_work"
  standard: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_rpm"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES += "debug-tweaks package-management"
  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
  build-info: |
    INHERIT += "image-buildinfo"
    IMAGE_BUILDINFO_VARS = "DISTRO DISTRO_VERSION MACHINE DEVICE_MODEL DEVICE_TYPE IMX_GPU_VERSION RELEASE_VERSION"
    RELEASE_VERSION = "v2.01.03"
  license-flags: |
    ACCEPT_FSL_EULA = "1"
    LICENSE_FLAGS_ACCEPTED:append = " commercial"
  users-groups: |
    EXTRA_USERS_PARAMS += " useradd -m -s /bin/bash -a -G video,render,wayland,input,root,sudo,dialout,plugdev,tty,disk -p '$(openssl passwd adlink)' adlink; \
                            usermod -a -G video,render,wayland,input,root,sudo,dialout,plugdev,tty,disk -p '$(openssl passwd weston)' weston; \
                            usermod -p '$(openssl passwd root)' root;"
  docker-groups: |
    APTGET_ADD_USERS = "adlink:rbBJY7ksv1BvY:/bin/bash"
    APTGET_ADD_USERS:append = "${@bb.utils.contains_any('DEPENDS', 'docker-datapart image-datapart', ':${USER_EXTRA_GROUPS}', '', d)}"
    USER_EXTRA_GROUPS = "${@bb.utils.contains_any('DEPENDS', 'docker-datapart image-datapart', ',docker', '', d)}"
    EXTRA_USERS_PARAMS:append = "${@bb.utils.contains_any('DEPENDS', 'docker-datapart image-datapart', ' usermod -a -G docker adlink;', '', d)}"
  image-features: |
    IMAGE_FEATURES[validitems] += "kiosk-mode hab remote logo resize locale fastboot"
    EXTRA_IMAGE_FEATURES += "ssh-server-openssh"
    DISTRO_FEATURES:append = " sensors adlink optee"
    MACHINE_FEATURES:append = " stmm"
    IMAGE_FSTYPES = "wic.bmap wic.gz"
  sanity-check: |
    CONNECTIVITY_CHECK_URIS = "https://www.google.com"
  package-configs: |
    TOOLCHAIN_TARGET_TASK:append = " onnxruntime-dev"
    PACKAGECONFIG:append:pn-qemu-system-native = " sdl"
    PACKAGECONFIG:append:pn-opencv_mx8 = " test"
    UBOOT_EXTRA_CONFIGS:append = " LPDDR4_ALL"
    RDEPENDS:qtbase:remove="vulkan-loader"
    RDEPENDS:qtbase:append=" libvulkan-imx"
    KERNEL_MODULE_AUTOLOAD:append = "${@bb.utils.contains('MACHINE_FEATURES', 'wifi', ' mlan moal', '', d)}"
  package-masks: |
    BBMASK += "poky/meta/recipes-devtools/pseudo"
  desktop-packages: |
    APTGET_EXTRA_PACKAGES += "python3-pip"
    YOCTO-DEPENDS-LIST:append = " libc6-dev python3-2to3 python3-profile"
